# Spell-check configuration for `typos` (https://github.com/crate-ci/typos).

[files]
extend-exclude = [
    # Third-party submodule and generated or recorded data.
    "extension-ci-tools/",
    "Cargo.lock",
    "proptest-regressions/",
]

[default.extend-identifiers]
# Mermaid node names in docs/src/*.md.
SME = "SME"
FWE = "FWE"

[default.extend-words]
# `let ba = b.combine(&a)` in src/retention.rs tests.
ba = "ba"
# "mis-classified" is hyphenated in CHANGELOG.md.
mis = "mis"
