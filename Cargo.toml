[package]
name = "duckdb-behavioral"
version = "0.10.1"
edition = "2024"
rust-version = "1.88"
authors = ["Tom F <tomtom215@users.noreply.github.com>"]
description = "Behavioral analytics functions for DuckDB: sessionize, retention, funnels, sequence matching"
license = "MIT"
repository = "https://github.com/tomtom215/duckdb-behavioral"
homepage = "https://tomtom215.github.io/duckdb-behavioral"
documentation = "https://tomtom215.github.io/duckdb-behavioral"
keywords = ["duckdb", "analytics", "funnel", "retention", "behavioral"]
categories = ["database", "science"]
# A DuckDB loadable extension: distributed as a `.duckdb_extension` binary
# (GitHub releases, DuckDB Community Extensions), not as a crate. The Rust API
# is internal; SQL is the interface.
publish = false

[lib]
name = "behavioral"
crate-type = ["cdylib", "rlib"]

[dependencies]
quack-rs = "=0.19.0"
libduckdb-sys = { version = "=1.20000.1", features = ["loadable-extension"] }
smallvec = { version = "1", features = ["const_new"] }

[features]
# The in-process extension-load tests (`tests/extension_load.rs`) `LOAD` the
# release library into a real DuckDB, which quack-rs's `testing::InMemoryDb`
# provides through its `duckdb` dependency: that pulls in the arrow stack and
# needs a libduckdb to link. The unit tests need neither, so a bare
# `cargo test --lib` works on a fresh clone; run everything with
# `DUCKDB_DOWNLOAD_LIB=1 cargo test --all-features`. This feature is for tests
# only: never enable it for a release build.
e2e = ["quack-rs/bundled-test-prebuilt"]

[[test]]
name = "extension_load"
required-features = ["e2e"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "sessionize_bench"
harness = false

[[bench]]
name = "retention_bench"
harness = false

[[bench]]
name = "window_funnel_bench"
harness = false

[[bench]]
name = "sequence_bench"
harness = false

[[bench]]
name = "sort_bench"
harness = false

[[bench]]
name = "sequence_next_node_bench"
harness = false

[[bench]]
name = "sequence_match_events_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Must stay "unwind": every aggregate callback runs under quack-rs's
# `catch_unwind` guard (aggregate_*_callback! macros), which turns a panic into
# a SQL error. Under "abort" the guard is inert and a panic kills the host
# DuckDB process.
panic = "unwind"
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = true

[profile.bench]
opt-level = 3
lto = "thin"

[lints.rust]
missing_docs = "warn"
# All `unsafe` lives in `src/ffi`, which opts out with `#[allow(unsafe_code)]`
# in lib.rs; the pure-Rust core cannot grow an unsafe block by accident.
unsafe_code = "deny"

[lints.clippy]
# Every unsafe block is one operation with a `// SAFETY:` note above it.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Lint groups (priority -1 so individual overrides take precedence)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Timestamp and interval arithmetic: `later.wrapping_sub(earlier) as u64` reads
# a gap of up to twice `i64::MAX` exactly (DuckDB's ±infinity), and row and
# step counts are cast between `usize`, `u32` and `i64` after range checks.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Callbacks and builders are not `const`-evaluable even when they only use size_of.
missing_const_for_fn = "allow"
# Dependency version duplicates (transitive through duckdb)
multiple_crate_versions = "allow"
