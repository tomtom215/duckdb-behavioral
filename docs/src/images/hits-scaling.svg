<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" width="920" height="530" role="img" aria-labelledby="t d">
<title id="t">Cost per row as the data grows</title>
<desc id="d">Lines of nanoseconds per row against scale for every behavioral query; sessionize 94.1 ns at 100M rows, window_funnel 69.9 ns at 100M rows, sequence_next_node 261.9 ns at 100M rows.</desc>
