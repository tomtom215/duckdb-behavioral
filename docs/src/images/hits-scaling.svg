<text x="36" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13.5" fill="#c3c2b7">A flat line means time grows in step with the rows. Small scales carry the fixed cost of opening the files and loading the extension.</text>
