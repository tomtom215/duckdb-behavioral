# CI, releases and contributors build with this exact compiler, so a new Rust
# release cannot turn a green tree red (it has: a new clippy lint broke CI in
# the 0.10.0 cycle). .github/workflows/scheduled.yml builds with the next
# stable and beta weekly; bump this line when those pass. The MSRV
# (Cargo.toml `rust-version`) is checked separately by the `msrv` CI job.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
