name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel redundant runs on the same pull request. A push to main is never
# cancelled: back-to-back merges would otherwise cancel the run that warms the
# cache for the pull requests after it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  # Dev/test builds link a prebuilt libduckdb downloaded by libduckdb-sys
  # instead of compiling DuckDB's C++ tree from source (quack-rs
  # `bundled-test-prebuilt`). The release path (`make release` in e2e.yml)
  # does not set it.
  DUCKDB_DOWNLOAD_LIB: "1"

# Every `cargo` call uses --locked: a stale Cargo.lock fails the job instead
# of being silently rewritten.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all -- --check

  # `cargo clippy --all-targets` also type-checks every target (benchmarks
  # included), so there is no separate `cargo check` or benchmark-compile job.
  # `--all-features` brings in `e2e`, which gates tests/extension_load.rs.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      # Unit tests, proptests, and tests/extension_load.rs (which builds the
      # release cdylib and LOADs it into an in-memory DuckDB). Not
      # `--all-targets`: that would also run the Criterion benchmarks as tests,
      # at full scale (a billion elements), for nothing a unit test does not.
      - run: cargo nextest run --lib --tests --all-features --locked --profile ci
      # nextest does not run doc-tests.
      - run: cargo test --doc --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: warn

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --no-deps --document-private-items --locked

  # The MSRV is the highest `rust-version` among the dependencies that link
  # into the build (libduckdb-sys / duckdb declare 1.88); Cargo.toml and the
  # docs say the same number.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
          cache-key: msrv
      - run: cargo check --all-targets --all-features --locked

  # The library must compile for every platform it ships on or may ship on, not
  # only the two CI executes. The community channel serves Windows x86_64 and
  # the release workflow builds osx_amd64 and linux_arm64 without running them
  # on this tree; wasm is not shipped (description.yml) but compiles.
  cross-check:
    name: Cross check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The loadable-extension build uses pregenerated bindings and needs no
      # library to link, so nothing is downloaded (none exists for wasm).
      DUCKDB_DOWNLOAD_LIB: "0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-unknown-emscripten
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: cross-${{ matrix.target }}
      - run: cargo check --target "${{ matrix.target }}" --lib --locked

  # ── Supply chain and hygiene ─────────────────────────────────────────
  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  hygiene:
    name: Hygiene (unused deps, typos, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-machete,typos,zizmor,shellcheck
      # `--with-metadata` asks cargo for the real dependency graph, which finds
      # a dependency that is declared but only named in a comment or a path.
      - name: Unused dependencies
        run: cargo machete --with-metadata
      - name: Spelling
        run: typos
      # install-action has no actionlint manifest: fetch the release and
      # verify its published checksum.
      - name: Workflow lint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Workflow security audit
        run: zizmor --offline --no-progress --min-severity medium .github
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: License headers
        run: scripts/add-spdx-headers.sh --check

  # ── Coverage (informational) ─────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Generate coverage report
        run: cargo llvm-cov nextest --all-features --locked --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── Build, SQL logic tests, DuckDB-version matrix ────────────────────
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  # ── Single required status check for branch protection ───────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - doc
      - msrv
      - cross-check
      - deny
      - hygiene
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r '"| Job | Result |", "|---|---|", (to_entries[] | "| \(.key) | \(.value.result) |")' >> "$GITHUB_STEP_SUMMARY"
          # Coverage is informational and not a need: the required check does
          # not wait up to 40 minutes for it. Every listed job must succeed.
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
