name: E2E

# Builds the extension the way the community-extensions CI does, runs the SQL
# logic tests, and loads the one resulting binary into every DuckDB release
# that shares its stable C API. Called from ci.yml, so the single CI Gate
# covers it; also runnable by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  # The DuckDB release the SQL logic tests (Makefile: DUCKDB_TEST_VERSION) and
  # the per-platform check below run against. The older releases are in the
  # `compat` matrix.
  DUCKDB_VERSION: "v2.0.0"

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
            cli_platform: linux-amd64
          - os: macos-latest
            platform: osx_arm64
            cli_platform: osx-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e-${{ matrix.platform }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the extension
        run: |
          make configure
          make release
      # The community Makefile calls `cargo build --release` without --locked
      # (it is not ours to change), so a stale Cargo.lock would be re-resolved
      # silently and the binary would differ from the one CI tested.
      - name: Cargo.lock unchanged by the build
        run: git diff --exit-code -- Cargo.lock
      - name: SQL logic tests (test/sql)
        run: make test_release
      # The stamp promises every DuckDB with C API v1.2.0; a call to a slot
      # outside the stable prefix would break that without any test noticing on
      # a recent DuckDB. Needs symbols, which the release profile strips.
      - name: Stable C API surface
        if: matrix.platform == 'linux_amd64'
        run: |
          cargo build --profile profiling --lib --locked
          python3 -I scripts/check-stable-api.py target/profiling/libbehavioral.so
      - name: Check the built binary in DuckDB ${{ env.DUCKDB_VERSION }}
        run: |
          scripts/install-duckdb-cli.sh "$DUCKDB_VERSION" "${{ matrix.cli_platform }}" "$RUNNER_TEMP/duckdb"
          scripts/compat-check.sh "$RUNNER_TEMP/duckdb/duckdb" build/release/behavioral.duckdb_extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ matrix.platform }}
          path: build/release/behavioral.duckdb_extension
          retention-days: 7
          if-no-files-found: error

  # The extension is stamped for the stable C API (`C_STRUCT`, C API v1.2.0), so
  # the Linux binary built above must load and answer correctly in every older
  # release that has that C API.
  compat:
    name: Compat (DuckDB ${{ matrix.duckdb }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # v1.4.5 and v1.5.6 are the releases the community-extensions build
        # compiles this extension for (scripts/build.py there).
        duckdb: ["v1.3.2", "v1.4.4", "v1.4.5", "v1.5.0", "v1.5.6"]
    steps:
      # No checkout of the code under test is needed beyond the scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            Cargo.toml
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-linux_amd64
          path: artifact
      - name: Load into DuckDB ${{ matrix.duckdb }} and check results
        env:
          DUCKDB: ${{ matrix.duckdb }}
        run: |
          scripts/install-duckdb-cli.sh "$DUCKDB" linux-amd64 "$RUNNER_TEMP/duckdb"
          scripts/compat-check.sh "$RUNNER_TEMP/duckdb/duckdb" artifact/behavioral.duckdb_extension
