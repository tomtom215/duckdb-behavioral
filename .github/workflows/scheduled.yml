name: Scheduled

# Things that can break without a commit: a new RustSec advisory, a new Rust
# release (rust-toolchain.toml pins one), a newer compatible dependency, and
# the next DuckDB release. A red run here is a heads-up, not a blocked merge.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  RUST_BACKTRACE: 1
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # The pinned toolchain is what CI and releases use. These two jobs show what
  # the next stable and beta Rust releases would change (new lints, new
  # errors) before the pin is bumped.
  toolchain:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
          cache-key: canary-${{ matrix.toolchain }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked

  # Cargo.lock pins what CI tests. This job tests what a fresh `cargo update`
  # would pick, which is what a user building from source without --locked
  # gets.
  latest-deps:
    name: Latest compatible dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: latest-deps
      - run: cargo update
      - run: cargo test --all-features

  # The binary is stamped for the stable C API, so it must keep loading into
  # DuckDB releases that do not exist yet. Today's nightly stands in for the
  # next one.
  duckdb-nightly:
    name: Extension in DuckDB nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: duckdb-nightly
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the extension
        run: |
          make configure
          make release
      - name: Load into the DuckDB nightly Python package
        run: |
          python -m pip install --pre duckdb
          python scripts/nightly-smoke.py build/release/behavioral.duckdb_extension

  # Coverage-guided fuzzing of the pure-Rust core, two minutes per target. It
  # reaches panics and hangs that the property tests' generators do not (a hang
  # matters most: DuckDB gives an aggregate no way to be interrupted). The
  # targets are in fuzz/; run one locally with
  # `cargo +nightly fuzz run parse -- -max_total_time=60 -timeout=5`.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [parse, sequence, funnel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          cache-key: fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$TARGET" -- -max_total_time=120 -timeout=5 -dict=fuzz/dict.txt
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 30
          if-no-files-found: ignore
