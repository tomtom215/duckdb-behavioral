# Dependabot configuration for automated dependency updates.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Keep GitHub Actions up to date. Every `uses:` is pinned to a commit SHA
  # (supply-chain hardening); Dependabot proposes the new SHA and tag comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # A release younger than a week is not proposed: a compromised or yanked
    # release is usually caught within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The composite action under .github/actions/ pins actions too.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-rust"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Keep Rust (Cargo) dependencies up to date. libduckdb-sys, duckdb and
  # quack-rs are pinned with `=`: they move together with the DuckDB release
  # the bindings are generated from, so review those PRs against CLAUDE.md
  # "Updating DuckDB version".
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    # quack-rs accepts libduckdb-sys `>=1.4.4, <1.20100` (its manifest): the
    # 1.20100 bindings are DuckDB 2.1's, and a bump to them cannot resolve until
    # a quack-rs release widens that range. Patch releases still flow.
    ignore:
      - dependency-name: "libduckdb-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      dev-and-test:
        # arrow, proptest, criterion, ...: build and test dependencies that
        # never link into the extension.
        dependency-type: "development"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"

  # The fuzz crate is detached from the workspace and has its own lockfile
  # (libfuzzer-sys, arbitrary); without this entry it is never proposed an
  # update. Its path dependency on the root crate is refreshed with
  # `cargo update --manifest-path fuzz/Cargo.toml` whenever the root pins move.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      fuzz:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
