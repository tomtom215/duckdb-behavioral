# cargo-fuzz targets for the pure-Rust core. Not part of the main build: the
# empty [workspace] below detaches this crate. Run from the repository root:
#   cargo +nightly fuzz run parse -- -max_total_time=60 -timeout=5
# (needs `cargo install cargo-fuzz` and a nightly toolchain).
[package]
name = "behavioral-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
duckdb-behavioral = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sequence"
path = "fuzz_targets/sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "funnel"
path = "fuzz_targets/funnel.rs"
test = false
doc = false
bench = false

[workspace]
